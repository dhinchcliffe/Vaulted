<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account · Vaulted</title><link rel="stylesheet" href="/static/css/style.css"><body style="padding:40px"><main><h1>Account</h1><p>Choose a new password for your private vault.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="password" type="password" minlength="12" autocomplete="new-password" required placeholder="At least 12 characters"><button class="btn">Update password</button></form>{% if message %}<p role="status">{{ message }}</p>{% endif %}<p><a href="/">Back to research</a></p><form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn">Sign out</button></form></main></body></html>

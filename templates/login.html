<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Vaulted</title><link rel="stylesheet" href="/static/css/style.css"><style>body{display:grid;place-items:center;min-height:100vh}.card{width:min(90vw,400px);padding:32px;background:#1d2028;border:1px solid #353b48;border-radius:16px}label,input{display:block;width:100%;margin:12px 0}input{box-sizing:border-box;padding:12px;background:#11151c;color:white;border:1px solid #465063;border-radius:6px}h1{margin-bottom:12px}p{margin:12px 0;color:#aeb8c9}</style><div class="card"><h1>Vaulted</h1><p>Your private research, wherever you are.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary">Sign in</button></form>{% if error %}<p role="alert">{{ error }}</p>{% endif %}</div></html>

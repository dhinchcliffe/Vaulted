<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaulted</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Vaulted</h1>
                <div class="vault-status" id="vaultStatus">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-text" id="statusText">Loading...</span>
                </div>
            </div>
            <div class="tree" id="fileTree">
                <div class="loading">Loading vault...</div>
            </div>
        </aside>
        <main class="content">
            <div class="toolbar">
                <span id="currentFile">Select a file</span>
                <div class="toolbar-actions">
                    <button id="addWebBtn" class="btn btn-primary" title="Add web page by URL">+ Web</button>
                    <button id="editBtn" class="btn" style="display:none;">Edit</button>
                    <button id="previewBtn" class="btn" style="display:none;">Preview</button>
                    <span id="saveStatus" class="save-status"></span>
                </div>
            </div>
            <div class="editor-container">
                <div id="preview" class="preview"></div>
                <textarea id="editor" class="editor" style="display:none;"></textarea>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>

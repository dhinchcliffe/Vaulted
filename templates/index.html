<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaulted</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/phone-layout.css') }}">
    <script src="/static/vendor/marked.min.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
</head>
<body{% if capture_path %} data-capture-path="{{ capture_path }}"{% endif %}>
    <div class="app">
        <aside class="sidebar" id="vaultSidebar" aria-label="Vault navigation">
            <div class="sidebar-header">
                <h1>Vaulted</h1><a href="/account" style="color:#aeb8c9;font-size:12px">Account / sign out</a><a href="/share/setup" style="color:#aeb8c9;font-size:12px">Save from iPhone</a>
                <div class="vault-status" id="vaultStatus">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-text" id="statusText">Loading...</span>
                </div>
                <div class="phone-only drawer-controls">
                    <button type="button" class="btn btn-secondary" id="drawerSearch">Search</button>
                    <button type="button" class="btn btn-secondary" id="closeDrawer">Close</button>
                </div>
                <div class="phone-only" id="drawerStatus" role="status"></div>
            </div>
            
            <!-- Search Panel (hidden by default) -->
            <div class="search-panel" id="searchPanel" style="display: none;">
                <div class="search-header">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search vault..." autocomplete="off">
                    <button id="searchCloseBtn" class="search-close" title="Close search (Esc)">×</button>
                </div>
                <div class="search-results" id="searchResults">
                    <div class="search-placeholder">Type to search...</div>
                </div>
            </div>
            
            <div class="tree" id="fileTree">
                <details id="recentPages" open>
                    <summary class="tree-item recent-heading"><span class="icon icon-folder" aria-hidden="true"></span>Recently used</summary>
                    <div class="tree-children" id="recentPageList"></div>
                </details>
                <div id="physicalTree"><div class="loading">Loading vault...</div></div>
            </div>
        </aside>
        <div class="phone-only" id="drawerBackdrop"></div>
        <button type="button" class="btn" id="restorePhone">Use phone layout</button>
        <main class="content">
            <div class="toolbar">
                <button type="button" class="btn btn-secondary phone-only" id="browseBtn" aria-controls="vaultSidebar" aria-expanded="false">Browse</button>
                {% if capture_path %}<a href="/" class="capture-back">Vault</a>{% endif %}
                <span id="currentFile">Select a file</span>
                <div class="toolbar-actions">
                    <div id="secondaryActions">
                        <button id="searchBtn" class="btn btn-secondary" title="Search vault (Cmd+Shift+S)">🔍 Search <span class="shortcut-hint">⌘⇧S</span></button>
                        <button id="quickPasteBtn" class="btn btn-primary" title="Quick paste from clipboard (Cmd+Shift+V)">📋 Paste <span class="shortcut-hint">⌘⇧V</span></button>
                        <button id="addWebBtn" class="btn btn-primary" title="Add web page by URL (Cmd+Shift+U)">+ Web <span class="shortcut-hint">⌘⇧U</span></button>
                        <button id="autoFileBtn" class="btn btn-secondary" title="Auto-file this document (Cmd+Shift+F)">🗂️ Auto-File <span class="shortcut-hint">⌘⇧F</span></button>
                        <button type="button" class="btn btn-secondary phone-only" id="useFull">Use full layout</button>
                    </div>
                    <button id="editBtn" class="btn" style="display:none;">Edit</button>
                    <button id="previewBtn" class="btn" style="display:none;">Preview</button>
                    <button type="button" class="btn btn-secondary phone-only" id="moreBtn" aria-controls="secondaryActions" aria-expanded="false">More</button>
                    <span id="saveStatus" class="save-status"></span>
                </div>
            </div>
            <div id="imageMigrationBanner" class="image-migration-banner" hidden>
                <span id="imageMigrationMessage" role="status" aria-live="polite"></span>
                <div class="image-migration-actions">
                    <button id="migrateImagesBtn" class="btn btn-secondary">Save images in Vaulted</button>
                    <button id="dismissImageMigrationBtn" class="btn">Not now</button>
                </div>
            </div>
            <div class="editor-container">
                <div id="preview" class="preview"></div>
                <textarea id="editor" class="editor" style="display:none;"></textarea>
            </div>
            
            <!-- Context Menu -->
            <div id="contextMenu" class="context-menu" style="display:none;">
                <div class="context-menu-item" id="contextAddPage" role="button" tabindex="0" style="display:none;">+ Add Page</div>
                <div class="context-menu-item" id="contextRename" role="button" tabindex="0">Rename</div>
            </div>

            <!-- Add Page Modal -->
            <div id="addPageModal" class="modal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Add Page</h3>
                        <button class="modal-close" onclick="closeAddPageModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="suggestion-box">
                            <label for="addPageInput">Page name:</label>
                            <input type="text" id="addPageInput" class="suggestion-path-input" placeholder="A blank page">
                        </div>
                        <div class="modal-actions">
                            <button id="confirmAddPageBtn" class="btn btn-primary">Create Page</button>
                            <button onclick="closeAddPageModal()" class="btn">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Rename Modal -->
            <div id="renameModal" class="modal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Rename</h3>
                        <button class="modal-close" onclick="closeRenameModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="suggestion-box">
                            <label for="renameInput">New name:</label>
                            <input type="text" id="renameInput" class="suggestion-path-input" placeholder="New name">
                        </div>
                        <div class="modal-actions">
                            <button id="confirmRenameBtn" class="btn btn-primary">Rename</button>
                            <button onclick="closeRenameModal()" class="btn">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Paste Modal -->
            <div id="quickPasteModal" class="modal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>📋 Quick Paste</h3>
                        <button class="modal-close" onclick="closeQuickPasteModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="suggestion-box">
                            <label>Paste your content here (rich text supported):</label>
                            <div id="quickPasteArea" contenteditable="true" class="quick-paste-area" placeholder="Paste here..."></div>
                        </div>
                        <div class="modal-actions">
                            <button id="confirmQuickPasteBtn" class="btn btn-primary">Create Page</button>
                            <button onclick="closeQuickPasteModal()" class="btn">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Auto-File Modal -->
            <div id="autoFileModal" class="modal" style="display:none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>🗂️ Auto-File Suggestion</h3>
                        <button class="modal-close" onclick="closeAutoFileModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div id="autoFileLoading" class="modal-loading">
                            <div class="spinner"></div>
                            <p>Analyzing document...</p>
                        </div>
                        <div id="autoFileResult" class="modal-result" style="display:none;">
                            <div class="suggestion-box">
                                <label for="autoFileSuggestionInput">Suggested Location:</label>
                                <input type="text" id="autoFileSuggestionInput" class="suggestion-path-input" placeholder="Folder/Subfolder">
                                <div id="autoFileReasoning" class="suggestion-reasoning"></div>
                            </div>
                            <div class="modal-actions">
                                <button id="confirmFileBtn" class="btn btn-primary">📁 File Here</button>
                                <button onclick="closeAutoFileModal()" class="btn">Cancel</button>
                            </div>
                        </div>
                        <div id="autoFileError" class="modal-error" style="display:none;">
                            <p id="autoFileErrorMsg"></p>
                            <button onclick="closeAutoFileModal()" class="btn">Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/image-migration.js') }}"></script>
    <script src="{{ url_for('static', filename='js/phone-layout.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
